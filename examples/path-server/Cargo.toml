[package]
name = "path-server"
version = "0.1.0"
edition = "2024"
publish.workspace = true

[[bin]]
name = "path-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1.0"
parking_lot = "0.12"
bytes = "1.0"
async-trait = "0.1"
rand = "0.9"

common     = { path = "../common" }
framework  = { path = "../../framework", features = ["serde"] }
u-core     = { path = "../../u-core" }
files      = { path = "../../files" }
network    = { path = "../../network" }
protocol   = { path = "../../protocol" }
packets    = { path = "../../packets" }
