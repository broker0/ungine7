[package]
name = "web-proxy"
version = "0.1.0"
edition = "2024"
publish.workspace = true

[lib]
name = "web_proxy"
path = "src/lib.rs"

[[bin]]
name = "web-proxy"
path = "src/main.rs"

[dependencies]
u-core      = { path = "../../u-core" }
network = { path = "../../network" }
protocol  = { path = "../../protocol", features = ["proxy"] }
packets   = { path = "../../packets" }
common = { path = "../common" }

tokio        = { version = "1.51.1", features = ["full"] }
async-trait  = "0.1.89"
log          = "0.4"

axum         = { version = "0.8", features = ["ws"] }
tower-http   = { version = "0.6", features = ["cors"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
bytes        = "1"
