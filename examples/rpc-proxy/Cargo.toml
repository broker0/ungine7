[package]
name = "rpc-proxy"
version = "0.1.0"
edition = "2024"
publish.workspace = true

[features]
default = ["lua"]
default-server = ["common/default-server"]
lua = ["dep:mlua", "dep:notify", "dep:tokio-util", "framework/lua"]

[lib]
name = "rpc_proxy"
path = "src/lib.rs"

[[bin]]
name = "rpc-proxy"
path = "src/main.rs"

[dependencies]
u-core = { path = "../../u-core" }
network = { path = "../../network" }
protocol = { path = "../../protocol", features = ["proxy"] }
packets = { path = "../../packets", features = ["serde"] }
common = { path = "../common" }
framework = { path = "../../framework" }
macros = { path = "../../macros" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
bytes = "1"
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.26"
futures-util = "0.3"

mlua       = { version = "0.10", features = ["lua54", "send", "vendored", "async"], optional = true }
notify     = { version = "7", optional = true }
tokio-util = { version = "0.7", optional = true }
